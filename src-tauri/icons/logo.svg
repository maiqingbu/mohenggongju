<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g1" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#5ee8b5"/>
      <stop offset="100%" stop-color="#2aaa7a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底 -->
  <rect width="1024" height="1024" rx="224" fill="url(#g2)"/>

  <!-- 墨滴主体：上圆下尖的水滴形 -->
  <path d="
    M 512 160
    C 640 160, 760 290, 760 440
    C 760 560, 680 660, 580 710
    L 512 748
    L 444 710
    C 344 660, 264 560, 264 440
    C 264 290, 384 160, 512 160
    Z
  " fill="url(#g1)" opacity="0.92"/>

  <!-- 衡线：穿过墨滴中偏上的水平线 -->
  <rect x="310" y="395" width="404" height="12" rx="6" fill="#1a1a24" opacity="0.55"/>

  <!-- 左端圆点 -->
  <circle cx="310" cy="401" r="18" fill="#1a1a24" opacity="0.5"/>
  <!-- 右端圆点 -->
  <circle cx="714" cy="401" r="18" fill="#1a1a24" opacity="0.5"/>

  <!-- 中心支点三角 -->
  <path d="M 512 407 L 498 440 L 526 440 Z" fill="#1a1a24" opacity="0.4"/>

  <!-- 墨滴高光（左上角弧形反光） -->
  <ellipse cx="420" cy="280" rx="60" ry="80" fill="#fff" opacity="0.06" transform="rotate(-20 420 280)"/>
</svg>
