[package]
name = "novel-studio"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
base64 = "0.22"
futures-util = "0.3"
keyring = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
